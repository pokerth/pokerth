# Experimental — weak alignment with unified devcontainer paths (not CI-tested; may still break).
# Canonical flow: .devcontainer/devcontainer.json + `make windows-docker` / `run_devcontainer.py`.
#
# Changes vs old compose: `final` image (toolchains from `make setup-toolchains`), IN_DOCKER + TARGET_PLATFORM,
# vcpkg/Qt: docker/windows/build/ per functions.sh; toolchain: host ~/.pokerth -> /opt/pokerth in container (CACHE_ROOT).
#
# From repo root:
#   docker compose -f docker/windows/docker-compose.yml build
#   docker compose -f docker/windows/docker-compose.yml run --rm windows-build bash -lc 'cd /workspaces/pokerth && make windows'
#
# If you need a long-lived shell: `... up -d` then `docker compose ... exec windows-build bash`.
# No Docker socket mount: `make windows` does not need Docker-in-Docker here.
version: '3.8'

services:
  windows-build:
    build:
      context: "../.."
      dockerfile: docker/Dockerfile
      target: final
    platform: linux/amd64
    environment:
      IN_DOCKER: "1"
      TARGET_PLATFORM: windows
    working_dir: /workspaces/pokerth
    volumes:
      - windows-build-cache:/home/vscode/.cache
      - "../..:/workspaces/pokerth:cached"
    command: sleep infinity

volumes:
  windows-build-cache:
