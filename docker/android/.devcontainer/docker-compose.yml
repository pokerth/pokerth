services:
  devcontainer:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../../../:/workspaces/pokerth:cached
      - ../build/vcpkg:/opt/pokerth-android/vcpkg:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    networks:
      base_net:
        ipv4_address: 172.30.0.31
networks:
  base_net:
    external: true
