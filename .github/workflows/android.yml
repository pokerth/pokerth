name: Build Android App Bundle (QML client)

# Manual only: a cold build cross-compiles boost/openssl/protobuf for every ABI
# via vcpkg and pulls one Qt kit per ABI, which takes hours. Cached, a full
# four-ABI run is roughly 60-90 minutes.
#
# Secrets used (all optional — without them the bundle is built unsigned and
# nothing is published):
#   ANDROID_KEYSTORE_BASE64    upload keystore, base64 encoded:
#                                base64 -w0 upload.keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password (defaults to the keystore password)
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  service account with "Release manager"
#                                     rights, only needed to publish
on:
  workflow_dispatch:
    inputs:
      abis:
        description: "ABIs to build (space separated, first one is the primary)"
        type: choice
        default: "arm64-v8a armeabi-v7a x86_64 x86"
        options:
          - "arm64-v8a armeabi-v7a x86_64 x86"   # every device Play serves
          - "arm64-v8a x86_64"                    # 64-bit only (all modern phones + Chromebooks)
          - "arm64-v8a"                           # fastest, phones/tablets only
      api_level:
        description: "compileSdk/targetSdk (Play requires 36 for new apps from 2026-08-31)"
        type: choice
        # 36 since 2.1.6: the first Play upload will land on or after that date,
        # and a bundle below the required targetSdk is rejected at upload time —
        # after the full build. 35 stays selectable to reproduce an older bundle.
        default: "36"
        options: ["36", "35"]
      version_code:
        description: "versionCode — must be higher than every previous upload (default: 100 + run number)"
        type: string
        default: ""
      universal_apk:
        description: "Also build a universal APK (side-load testing — an .aab cannot be installed directly)"
        type: boolean
        default: true
      play_track:
        description: "Publish to Google Play on this track"
        type: choice
        default: "none"
        options: [none, internal, alpha, beta, production]

jobs:
  build-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      QT_VERSION: "6.9.3"
      ANDROID_ABIS: ${{ inputs.abis }}
      ANDROID_API_LEVEL: ${{ inputs.api_level }}
      VERSION_CODE_INPUT: ${{ inputs.version_code }}
      UNIVERSAL_APK: ${{ inputs.universal_apk && '1' || '0' }}
      # The secrets context is not available in step `if:`, so fan it out to env here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}

    outputs:
      aab_name: ${{ steps.build.outputs.aab_name }}
      # The secrets context is not available in a job-level `if:`, so hand the
      # signing state down to publish-play as an output.
      signed: ${{ steps.prep.outputs.signed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 100 + run number, never the bare run number: the local builds in
      # docker/android/build_android.sh already shipped versionCode 20…27 as
      # side-load APKs under the same package name, and Android refuses to
      # install a lower code over them ("App not installed" =
      # INSTALL_FAILED_VERSION_DOWNGRADE). The offset keeps every workflow build
      # above everything that ever left this repo by hand.
      # (GitHub expressions have no arithmetic, hence the step.)
      - name: Resolve versionCode
        id: prep
        run: |
          echo "VERSION_CODE=${VERSION_CODE_INPUT:-$((100 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_ENV"
          echo "signed=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"

      # AGP 8.8 (pinned by Qt 6.9's Gradle template) needs JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Four Qt kits + four vcpkg triplets + NDK + build trees do not fit next to
      # the runner's preinstalled toolchains. The bundled NDKs go too — the build
      # installs the exact NDK version it was tested with.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Restore/save instead of actions/cache: a cold four-ABI run cross-compiles
      # boost for hours, and actions/cache drops everything when the job fails.
      # Each run saves its own snapshot (run_id suffix) and restores the newest
      # matching prefix, so a failed run still hands its finished ABIs to the
      # next one. Both Qt and vcpkg installs are additive and idempotent, so a
      # partial tree is always safe to build on.
      - name: Compute cache slug
        id: slug
        run: echo "abis=$(echo '${{ inputs.abis }}' | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore Qt
        uses: actions/cache/restore@v4
        with:
          path: ~/Qt
          key: android-qt-${{ env.QT_VERSION }}-${{ steps.slug.outputs.abis }}-${{ github.run_id }}
          restore-keys: |
            android-qt-${{ env.QT_VERSION }}-${{ steps.slug.outputs.abis }}-
            android-qt-${{ env.QT_VERSION }}-

      - name: Restore vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg
          key: android-vcpkg-${{ steps.slug.outputs.abis }}-${{ github.run_id }}
          restore-keys: |
            android-vcpkg-${{ steps.slug.outputs.abis }}-
            android-vcpkg-

      # Second half of the HTTP-429 defence (the first is the Maven mirror the
      # build script patches into Qt's Gradle template): a warm ~/.gradle carries
      # the Gradle distribution and the whole AGP classpath, so a repeat run does
      # not query Maven Central at all. Keyed per run like the caches above, so a
      # failed run still hands its downloads to the next one.
      - name: Restore Gradle caches
        uses: actions/cache/restore@v4
        with:
          # Only the two directories that hold downloads — not all of ~/.gradle,
          # whose daemon logs and per-build file hashes are worthless next run.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-gradle-${{ steps.slug.outputs.abis }}-${{ github.run_id }}
          restore-keys: |
            android-gradle-${{ steps.slug.outputs.abis }}-
            android-gradle-

      - name: Restore upload keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      # Without the keystore the build still succeeds, but the .aab is rejected
      # by Play and the universal .apk installs nowhere ("App not installed").
      # Say so where it cannot be missed — the artifact names carry it too.
      - name: Warn about missing signing secrets
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning title=Build will not be signed with the upload key::ANDROID_KEYSTORE_BASE64 is not set — Play rejects the unsigned bundle, and bundletool signs the universal APK with its debug key, which no existing PokerTH install accepts as an update."
          {
            echo "### ⚠️ Missing signing key"
            echo ""
            echo "\`ANDROID_KEYSTORE_BASE64\` is not set:"
            echo ""
            echo "- the **bundle is unsigned** — Google Play will reject it"
            echo "- the **universal APK carries bundletool's debug key** — it installs only on"
            echo "  devices that have no PokerTH yet, and is refused as an update over every"
            echo "  previously side-loaded build"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build multi-ABI App Bundle
        id: build
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash build_android_qml.sh
          echo "aab_name=$(basename "$(ls PokerTH-*.aab)")" >> "$GITHUB_OUTPUT"

      # if: always() — the whole point is to keep the ABIs that did finish when a
      # later one fails. vcpkg first: it is the expensive half.
      - name: Save vcpkg
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg
          key: android-vcpkg-${{ steps.slug.outputs.abis }}-${{ github.run_id }}

      - name: Save Qt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Qt
          key: android-qt-${{ env.QT_VERSION }}-${{ steps.slug.outputs.abis }}-${{ github.run_id }}

      # if: always() as well — a run that died in Gradle is exactly the one whose
      # partial downloads the next attempt should start from.
      - name: Save Gradle caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-gradle-${{ steps.slug.outputs.abis }}-${{ github.run_id }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          # Condition inverted on purpose: in `A && X || Y` GitHub returns Y
          # whenever X is falsy, and the empty string is falsy — so the empty
          # branch has to be the fallback, never the "true" branch.
          name: PokerTH-android-aab${{ env.HAS_KEYSTORE != 'true' && '-UNSIGNED' || '' }}-${{ github.sha }}
          path: |
            PokerTH-*.aab
            pokerth-play-icon-512.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        if: inputs.universal_apk
        uses: actions/upload-artifact@v4
        with:
          # Not "-UNSIGNED": without a keystore bundletool falls back to its own
          # debug key, so the APK is signed — just with the wrong certificate.
          # (Inverted condition, same empty-string-is-falsy reason as above.)
          name: PokerTH-android-universal-apk${{ env.HAS_KEYSTORE != 'true' && '-DEBUGKEY' || '' }}-${{ github.sha }}
          path: PokerTH-*-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: build-android-bundle/build/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Google Play only accepts a signed bundle whose versionCode is higher than
  # anything uploaded before. The very first upload of a package has to be made
  # by hand in the Play Console — the API cannot create a new app.
  # An unsigned bundle is uploaded under a "-UNSIGNED" artifact name and Play
  # would reject it anyway, so publishing is gated on the signing state instead
  # of failing later on a missing artifact.
  publish-play:
    needs: build-aab
    if: inputs.play_track != 'none' && needs.build-aab.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download App Bundle
        uses: actions/download-artifact@v4
        with:
          name: PokerTH-android-aab-${{ github.sha }}

      - name: Publish to Google Play (${{ inputs.play_track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.pokerth.qml
          releaseFiles: ${{ needs.build-aab.outputs.aab_name }}
          track: ${{ inputs.play_track }}
          status: completed
