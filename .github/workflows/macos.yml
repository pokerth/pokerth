name: Build macOS DMG (combined QML + Widget)

# Manual only: macOS runners bill at 10x the Linux rate and a cold build
# (vcpkg builds boost/protobuf, aqtinstall pulls ~2 GB of Qt) takes over an hour.
#
# Building the release DMG here rather than on a developer Mac guarantees that
# the artifact matches the commit it claims to be: the 2.1.4 DMG was built from
# a stale local working copy and shipped v2.1.3 sources — Info.plist said 2.1.3,
# the discworld/saloon themes and every other 2.1.4 feature were missing.
#
# The DMG is universal (x86_64 + arm64), so it runs natively on Intel Macs —
# including the Mac mini 2014 that produced the releases so far, whose x86_64
# builds ran on Apple Silicon only through Rosetta — and on Apple Silicon.
# The runner architecture is therefore irrelevant to what ships.
on:
  workflow_dispatch:

jobs:
  build-macos:
    # arm64 runner with Xcode preinstalled; Qt 6.9 needs Xcode 15+.
    runs-on: macos-15
    timeout-minutes: 180

    env:
      QT_VERSION: 6.9.2
      BUILD_DIR: build_macos_combined
      # Deliberate floor: at least one player is on macOS 12 (Monterey) and
      # cannot update. build_macos_common.sh sets and exports the same value —
      # it is repeated here only so the runner's toolchain picks it up before
      # any step runs, and so the check below has something to compare against.
      DEPLOYMENT_TARGET: "12.0"
      # The secrets context cannot be used in a step's "if", only in env — so
      # the presence of the signing credentials is turned into a flag here.
      # Without them the build signs ad-hoc, exactly as the local builds always
      # did: users then have to allow the app once via right click → Open.
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 != '' }}

    steps:
      # Full history incl. tags: build_macos_common.sh logs "git describe" for
      # the packaged tree, which is the whole point of building in CI.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Developer ID signing. Without the secrets the build falls back to ad-hoc
      # signing (see build_macos_common.sh), which is fine for a test build but
      # makes macOS refuse the app on any other Mac.
      #
      # Required repository secrets:
      #   MACOS_CERTIFICATE_P12       base64 of the exported "Developer ID
      #                               Application" certificate incl. private key
      #   MACOS_CERTIFICATE_PASSWORD  the password set while exporting the .p12
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/pokerth-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          CERT_FILE="$RUNNER_TEMP/certificate.p12"

          # A dedicated keychain that only exists for this job — never the
          # login keychain, which on a runner is unlocked for everything.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_FILE"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign
          rm -f "$CERT_FILE"
          # Lets codesign use the key without an interactive confirmation dialog.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
              $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                     | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$IDENTITY" ]; then
              echo "::error::no 'Developer ID Application' identity in the imported certificate"
              exit 1
          fi
          echo "Signing identity: $IDENTITY"
          # Picked up by build_macos_common.sh.
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      # Qt for macOS (~2 GB, several minutes via aqtinstall).
      #
      # Die Keys hängen bewusst NICHT an hashFiles(build_macos_*.sh): jede
      # unbeteiligte Skript-Änderung würde sonst beide Caches verwerfen und
      # vcpkg eine Stunde neu bauen lassen. Ein "zu alter" Cache ist
      # unkritisch: install-qt und "vcpkg install" laufen ohnehin bei jedem
      # Lauf und ergänzen nur, was fehlt.
      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: macos-qt-${{ env.QT_VERSION }}

      # boost/protobuf, once per architecture (release only) plus the merged
      # universal tree. Cold build ≈ 60-90 min, from cache ≈ 1 min.
      # PORT-REVISION beim Ändern der VCPKG_PORTS-Liste in build_macos_common.sh
      # hochzählen — ebenso, wenn sich MACOSX_DEPLOYMENT_TARGET ändert, weil die
      # gecachten Ports sonst gegen das alte Ziel gebaut bleiben.
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ~/vcpkg
          key: macos-vcpkg-r5-universal-deploy${{ env.DEPLOYMENT_TARGET }}

      - name: Build both clients and package the combined DMG
        run: bash build_macos_combined.sh

      # The check the 2.1.4 release lacked: does the finished DMG really carry
      # the sources of this commit? Compares the bundle version against
      # src/game_defs.h and the shipped QML themes against data/gfx/qml.
      - name: Verify DMG against the checkout
        run: |
          set -uo pipefail
          DMG=$(ls "$BUILD_DIR"/PokerTH-*-Combined.dmg 2>/dev/null || true)
          if [ ! -f "$DMG" ]; then
              echo "::error::no combined DMG in $BUILD_DIR"
              exit 1
          fi
          SOURCE_VERSION=$(sed -n 's/^#define[[:space:]]*POKERTH_BETA_RELEASE_STRING[[:space:]]*"\([^"]*\)".*/\1/p' src/game_defs.h)
          echo "Sources: PokerTH $SOURCE_VERSION — DMG: $(basename "$DMG")"

          MOUNT=$(mktemp -d)
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -readonly || exit 1

          # Collect every mismatch instead of stopping at the first one; the
          # step's exit code is decided at the end.
          set +e
          FAIL=0
          for APP in "PokerTH" "PokerTH Classic"; do
              RES="$MOUNT/$APP.app/Contents/Resources/data/gfx/qml"
              BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                  "$MOUNT/$APP.app/Contents/Info.plist")
              if [ "$BUNDLE_VERSION" != "$SOURCE_VERSION" ]; then
                  echo "::error::$APP.app reports '$BUNDLE_VERSION', sources say '$SOURCE_VERSION'"
                  FAIL=1
              fi
              for CAT in table cards backside; do
                  if ! diff <(ls "data/gfx/qml/$CAT") <(ls "$RES/$CAT"); then
                      echo "::error::$APP.app: shipped $CAT themes differ from the checkout"
                      FAIL=1
                  fi
              done
              echo "$APP.app: version $BUNDLE_VERSION, themes:" \
                   "$(ls "$RES/table" | wc -l | tr -d ' ') table," \
                   "$(ls "$RES/cards" | wc -l | tr -d ' ') cards," \
                   "$(ls "$RES/backside" | wc -l | tr -d ' ') backside"

              # One DMG for both architectures: a missing slice locks out either
              # every Intel Mac or every Apple Silicon Mac, and neither is
              # noticeable on the machine that built it.
              BIN="$MOUNT/$APP.app/Contents/MacOS/$APP"
              ARCHS=$(lipo -archs "$BIN")
              for WANT in x86_64 arm64; do
                  case " $ARCHS " in
                      *" $WANT "*) ;;
                      *) echo "::error::$APP.app has no $WANT slice (found: $ARCHS)"; FAIL=1 ;;
                  esac
              done
              # Per slice: must not demand a newer system than the intended
              # floor, otherwise it refuses to start on the oldest supported Mac.
              for A in $ARCHS; do
                  MINOS=$(otool -l -arch "$A" "$BIN" \
                          | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; exit}')
                  if [ "$MINOS" != "$DEPLOYMENT_TARGET" ]; then
                      echo "::error::$APP.app ($A) requires macOS $MINOS, expected $DEPLOYMENT_TARGET"
                      FAIL=1
                  else
                      echo "$APP.app ($A): runs on macOS $MINOS and newer"
                  fi
              done

              # Same for everything macdeployqt bundled: a single Qt framework
              # built for a newer system raises the floor for the whole app.
              WORST=$(find "$MOUNT/$APP.app/Contents/Frameworks" -type f \
                          \( -name "Qt*" -o -name "*.dylib" \) -print0 2>/dev/null \
                      | xargs -0 -n1 otool -l 2>/dev/null \
                      | awk '/LC_BUILD_VERSION/{f=1} f && /minos/{print $2; f=0}' \
                      | sort -V | tail -1)
              if [ -n "$WORST" ] && \
                 [ "$(printf '%s\n%s\n' "$WORST" "$DEPLOYMENT_TARGET" | sort -V | tail -1)" \
                   != "$DEPLOYMENT_TARGET" ]; then
                  echo "::error::$APP.app bundles a library requiring macOS $WORST"
                  FAIL=1
              fi
          done

          hdiutil detach "$MOUNT" || hdiutil detach "$MOUNT" -force
          exit $FAIL

      # Notarization: Apple inspects the signed DMG and issues a ticket, which is
      # then stapled into it. Without it macOS still refuses a downloaded app
      # ("Apple cannot check it for malicious software") even when the signature
      # is valid — a Developer ID certificate alone is not enough.
      #
      # Required repository secrets (App Store Connect → Users and Access →
      # Integrations → App Store Connect API, role "Developer"):
      #   MACOS_NOTARY_KEY_P8     base64 of the downloaded AuthKey_XXXXXXXX.p8
      #   MACOS_NOTARY_KEY_ID     the key ID (the XXXXXXXX from that file name)
      #   MACOS_NOTARY_ISSUER_ID  the issuer UUID shown above the key list
      - name: Notarize and staple
        if: env.HAS_NOTARY_KEY == 'true' && env.HAS_SIGNING_CERT == 'true'
        env:
          NOTARY_KEY_P8: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          DMG=$(ls "$BUILD_DIR"/PokerTH-*-Combined.dmg)
          KEY_FILE="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$NOTARY_KEY_P8" | base64 --decode > "$KEY_FILE"

          # The disk image is what people download, so it gets signed too.
          codesign --force --sign "$CODESIGN_IDENTITY" --timestamp "$DMG"

          # Submissions are rejected with little detail; on failure fetch the
          # log for the submission, which does name the offending file.
          if ! xcrun notarytool submit "$DMG" \
                   --key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
                   --wait --timeout 45m --output-format json > "$RUNNER_TEMP/notary.json"; then
              SUBMISSION=$(/usr/bin/python3 -c \
                  "import json;print(json.load(open('$RUNNER_TEMP/notary.json')).get('id',''))" \
                  2>/dev/null || true)
              if [ -n "$SUBMISSION" ]; then
                  echo "::group::notarytool log $SUBMISSION"
                  xcrun notarytool log "$SUBMISSION" \
                      --key "$KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
                  echo "::endgroup::"
              fi
              echo "::error::notarization failed"
              exit 1
          fi

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          # What Gatekeeper will do on the user's Mac.
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Summary
        run: |
          DMG=$(ls "$BUILD_DIR"/PokerTH-*-Combined.dmg)
          {
            echo "### $(basename "$DMG")"
            echo ""
            echo "- source: \`$(git describe --tags --always --dirty)\` (${GITHUB_SHA:0:8})"
            AUTHORITY=$(codesign -dvv "$BUILD_DIR/PokerTH.app" 2>&1 | awk -F'=' '/^Authority/{print $2; exit}')
            if [ -n "$AUTHORITY" ] && xcrun stapler validate "$DMG" >/dev/null 2>&1; then
              echo "- signing: $AUTHORITY, notarized"
            else
              echo "- signing: ad-hoc (no Developer ID secrets configured)"
              echo "- users have to allow the app once: right click → Open, or"
              echo "  System Settings → Privacy & Security → \"Open Anyway\" (macOS 15+)"
            fi
            echo "- architectures: \`$(lipo -archs "$BUILD_DIR/PokerTH.app/Contents/MacOS/PokerTH")\`, minimum macOS $DEPLOYMENT_TARGET"
            echo "- size: $(du -h "$DMG" | cut -f1)"
            echo "- md5: \`$(md5 -q "$DMG")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PokerTH-macos-combined-${{ github.sha }}
          path: build_macos_combined/PokerTH-*-Combined.dmg
          if-no-files-found: error
          retention-days: 30
          # The DMG is already zlib-compressed (UDZO) — repacking only costs time.
          compression-level: 0
