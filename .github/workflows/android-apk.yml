name: Build Android APKs (per-variant)

# Companion to android.yml (which builds the multi-ABI Play Store .aab): this
# workflow builds the individual, directly installable single-ABI .apk variants
# — the same ones the local docker/android/build_android_*_docker.sh wrappers
# produce, but on GitHub runners without Docker. Each variant runs as its own
# matrix job and uploads one .apk artifact.
#
# Variants:
#   widget-arm64            classic Widgets client, arm64, Qt 6.9, api 35/min 28
#   qml-arm64               QML client,             arm64, Qt 6.9, api 35/min 28
#   qml-armv7               QML client,       armeabi-v7a, Qt 6.9, api 35/min 28
#                           (32-bit-only devices — an arm64 APK cannot install
#                           there at all: INSTALL_FAILED_NO_MATCHING_ABIS)
#   qml-x86_64              QML client,           x86_64, Qt 6.9, api 35/min 28
#   qml-arm64-qt67-api26    QML client on Qt 6.7,   arm64, api 34/min 26
#                           (Android 8.0 devices, e.g. HUAWEI RNE-L21)
#
# A cold build cross-compiles boost/openssl/protobuf for the ABI via vcpkg and
# pulls one Qt kit — hours; cached it is roughly 20-40 minutes per variant.
#
# Secrets (all optional — without them the APK is built unsigned):
#   ANDROID_KEYSTORE_BASE64    keystore, base64 encoded:  base64 -w0 my.keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password (defaults to the keystore password)
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Which variant to build"
        type: choice
        default: "all"
        options:
          - all
          - widget-arm64
          - qml-arm64
          - qml-armv7
          - qml-x86_64
          - qml-arm64-qt67-api26
      version_code:
        description: "versionCode (default: 100 + run number)"
        type: string
        default: ""

jobs:
  # Turn the chosen variant (or "all") into the matrix the build job fans out on.
  set-matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        run: |
          # "code" is the ABI suffix of the versionCode (see "Resolve
          # versionCode" below). An F-Droid repo may hold only one APK per
          # (package, versionCode), so every variant of one release needs its
          # own code, and the client installs the *highest* code the device
          # can run: qt67/api26 < armeabi-v7a < arm64-v8a < x86_64.
          ALL='[
            {"name":"widget-arm64",         "target":"pokerth_client",     "abi":"arm64-v8a", "qt":"6.9.3", "api":"35", "min":"28", "code":"3"},
            {"name":"qml-arm64",            "target":"pokerth_qml-client", "abi":"arm64-v8a", "qt":"6.9.3", "api":"35", "min":"28", "code":"3"},
            {"name":"qml-armv7",            "target":"pokerth_qml-client", "abi":"armeabi-v7a", "qt":"6.9.3", "api":"35", "min":"28", "code":"2"},
            {"name":"qml-x86_64",           "target":"pokerth_qml-client", "abi":"x86_64",    "qt":"6.9.3", "api":"35", "min":"28", "code":"4"},
            {"name":"qml-arm64-qt67-api26", "target":"pokerth_qml-client", "abi":"arm64-v8a", "qt":"6.7.3", "api":"34", "min":"26", "code":"1"}
          ]'
          if [ "${{ inputs.variant }}" = "all" ]; then
            INCLUDE=$(echo "$ALL" | jq -c .)
          else
            INCLUDE=$(echo "$ALL" | jq -c --arg n "${{ inputs.variant }}" '[.[] | select(.name == $n)]')
          fi
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: set-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.include) }}

    env:
      BUILD_TARGET: ${{ matrix.target }}
      PACKAGE_FORMAT: apk
      QT_VERSION: ${{ matrix.qt }}
      ANDROID_ABIS: ${{ matrix.abi }}
      ANDROID_API_LEVEL: ${{ matrix.api }}
      ANDROID_MIN_SDK: ${{ matrix.min }}
      VERSION_CODE_INPUT: ${{ inputs.version_code }}
      ABI_CODE: ${{ matrix.code }}
      # The secrets context is not available in step `if:`, so fan it out here.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 100 + run number, never the bare run number: this workflow's run numbers
      # start at 1, while the local builds in docker/android/build_android.sh
      # already shipped versionCode 20…26 as side-load APKs under the same
      # package name. Installing a lower code over one of those fails with
      # INSTALL_FAILED_VERSION_DOWNGRADE, which Android only shows as
      # "App not installed". The offset keeps every workflow build above them.
      # (GitHub expressions have no arithmetic, hence the step.)
      #
      # The base is then shifted one decimal place and the variant's ABI code
      # appended, the scheme Play uses for ABI splits: every variant of a run
      # gets its own versionCode, which the F-Droid repo (fdroid.yml) requires
      # — it indexes one APK per (package, versionCode) and hands a device the
      # highest code it can install. Base 137 → 1371 (qt67) … 1374 (x86_64).
      - name: Resolve versionCode
        run: |
          BASE="${VERSION_CODE_INPUT:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "VERSION_CODE=$((BASE * 10 + ABI_CODE))" >> "$GITHUB_ENV"

      # AGP needs JDK 17 (Qt 6.9 → AGP 8.8, Qt 6.7 kit raised to AGP 8.2).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Each variant needs only its single ABI's Qt kit and vcpkg tree, so the
      # caches are keyed per Qt version + ABI. Restore/save (not actions/cache)
      # so a failed run still hands its finished tree to the next; both installs
      # are idempotent, so a partial tree is always safe to build on.
      - name: Restore Qt
        uses: actions/cache/restore@v4
        with:
          path: ~/Qt
          key: android-apk-qt-${{ matrix.qt }}-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: |
            android-apk-qt-${{ matrix.qt }}-${{ matrix.abi }}-

      - name: Restore vcpkg
        uses: actions/cache/restore@v4
        with:
          path: ~/vcpkg
          key: android-apk-vcpkg-${{ matrix.abi }}-${{ github.run_id }}
          restore-keys: |
            android-apk-vcpkg-${{ matrix.abi }}-

      # Second half of the HTTP-429 defence (the first is the Maven mirror the
      # build script patches into Qt's Gradle template): a warm cache carries the
      # Gradle distribution and the whole AGP classpath, so a repeat run does not
      # query Maven Central at all. Keyed per variant — two variants can share an
      # ABI (widget-arm64/qml-arm64), and parallel jobs must not save one key.
      - name: Restore Gradle caches
        uses: actions/cache/restore@v4
        with:
          # Only the two directories that hold downloads — not all of ~/.gradle,
          # whose daemon logs and per-build file hashes are worthless next run.
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-apk-gradle-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            android-apk-gradle-${{ matrix.name }}-
            android-apk-gradle-

      - name: Restore signing keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      # Without the keystore the build still succeeds, but hands out an
      # app-release-unsigned.apk that no device will install ("App not
      # installed") — the whole point of this workflow. Say so where it cannot
      # be missed: as a run annotation, in the job summary, and in the artifact
      # name itself (see "Upload APK" below).
      - name: Warn about missing signing secrets
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::warning title=APK will be UNSIGNED::ANDROID_KEYSTORE_BASE64 is not set — the resulting APK cannot be installed on any device. Sign it locally (apksigner sign --ks docker/android/my.keystore --ks-key-alias app <apk>) or add the signing secrets."
          {
            echo "### ⚠️ Unsigned build"
            echo ""
            echo "\`ANDROID_KEYSTORE_BASE64\` is not set, so the APK is **unsigned** and will not install."
            echo "Either add the signing secrets, or sign the artifact locally:"
            echo ""
            echo '```'
            echo "apksigner sign --ks docker/android/my.keystore --ks-key-alias app <apk>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build ${{ matrix.name }} APK
        id: build
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash build_android_qml.sh
          echo "apk_name=$(basename "$(ls PokerTH-*.apk)")" >> "$GITHUB_OUTPUT"

      # if: always() — keep the finished Qt/vcpkg tree even if a later step fails.
      - name: Save vcpkg
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/vcpkg
          key: android-apk-vcpkg-${{ matrix.abi }}-${{ github.run_id }}

      - name: Save Qt
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Qt
          key: android-apk-qt-${{ matrix.qt }}-${{ matrix.abi }}-${{ github.run_id }}

      - name: Save Gradle caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: android-apk-gradle-${{ matrix.name }}-${{ github.run_id }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # Condition inverted on purpose: in `A && X || Y` GitHub returns Y
          # whenever X is falsy, and the empty string is falsy — so the empty
          # branch has to be the fallback, never the "true" branch.
          name: PokerTH-apk-${{ matrix.name }}${{ env.HAS_KEYSTORE != 'true' && '-UNSIGNED' || '' }}-${{ github.sha }}
          path: PokerTH-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-${{ matrix.name }}
          path: build-android-bundle/build/reports/
          if-no-files-found: ignore
          retention-days: 7
