<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Disco: leuchtende Kachel der Tanzflaeche – quadratisch mit weichen Ecken,
       Lichthof nach aussen, Glanz auf der oberen Haelfte, vertiefte Type.
       Dealer: Magenta – die Signaturfarbe der Tanzflaeche. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.26" stop-color="#FF2E9F" stop-opacity="0.75"/>
      <stop offset="0.58" stop-color="#FF2E9F" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF2E9F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FF9AD6"/>
      <stop offset="0.42" stop-color="#F2199A"/>
      <stop offset="1" stop-color="#7E0447"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Lichthof: das Leuchten der Kachel auf dem Filz -->
  <rect x="0" y="0" width="40" height="40" fill="url(#glow)"/>

  <!-- Kachelkoerper + heller Leuchtrand -->
  <rect x="5.4" y="5.4" width="29.2" height="29.2" rx="6.2" ry="6.2"
        fill="#4A0026" opacity="0.55" transform="translate(0,1.2)"/>
  <rect x="5.4" y="5.4" width="29.2" height="29.2" rx="6.2" ry="6.2"
        fill="url(#tile)" stroke="#FFC4E6" stroke-width="1.3" stroke-opacity="0.9"/>

  <!-- Glanz auf der oberen Haelfte (Glasboden ueber der Leuchtkachel) -->
  <rect x="8.1" y="7.3" width="23.8" height="11.6" rx="4.2" ry="4.2" fill="url(#gloss)"/>

  <!-- Type: dunkler Schatten, darueber die helle Schrift -->
  <text x="20" y="27.8" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="18.5" font-weight="900" fill="#4A0026" fill-opacity="0.75">D</text>
  <text x="20" y="26.9" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif"
        font-size="18.5" font-weight="900" fill="#ffffff">D</text>
</svg>
