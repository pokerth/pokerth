  <!-- 5. Ultrafette, kompakte Schrift für Big Blind -->
  <text x="22" y="29" font-family="'Arial Black', 'Impact', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">BB</text>
