<svg width="44" height="45" viewBox="0 0 44 45" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision">
  <!-- 1. Der 3D-Unterrand (Harter, dunkelroter Schattenkreis, nach unten versetzt) -->
  <circle cx="22" cy="24.5" r="18.5" fill="#4A000A" />

  <!-- 2. Der Hauptkörper (Klassisches Casino-Rot) -->
  <circle cx="22" cy="22" r="18.5" fill="#C8102E" stroke="#4A000A" stroke-width="1.5" />
  
  <!-- 3. Harter 3D-Glanzkeil (Simuliert Lichtreflexion am oberen Rand) -->
