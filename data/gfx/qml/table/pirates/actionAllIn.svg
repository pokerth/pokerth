<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 43">
  <!-- Pirates: Planke aus der Bordwand, mit Bleimennige rot gestrichen und
       abgeblaettert - das Signalholz unter den vier Knoepfen. Gleicher
       Plankenaufbau, die Farbschollen legen das nackte Holz frei. -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a33e29"/>
      <stop offset="0.55" stop-color="#6e2417"/>
      <stop offset="1" stop-color="#3d120c"/>
    </linearGradient>
    <linearGradient id="nail" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#c9bda8"/>
      <stop offset="0.5" stop-color="#7d7060"/>
      <stop offset="1" stop-color="#3f3428"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="166" height="41" rx="4" ry="4" fill="url(#base)"/>

  <!-- Laengsmaserung, durch den Anstrich hindurch -->
  <g fill="none" stroke="#2b0d07" stroke-linecap="round">
    <path d="M6 8.0Q46 6.2 86 8.0T162 8.0" stroke-width="0.9" stroke-opacity="0.28"/>
    <path d="M6 13.5Q46 15.1 86 13.5T162 13.5" stroke-width="0.6" stroke-opacity="0.20"/>
    <path d="M6 19.5Q46 18.4 86 19.5T162 19.5" stroke-width="1.1" stroke-opacity="0.24"/>
    <path d="M6 25.5Q46 27.3 86 25.5T162 25.5" stroke-width="0.7" stroke-opacity="0.18"/>
    <path d="M6 31.0Q46 29.3 86 31.0T162 31.0" stroke-width="0.9" stroke-opacity="0.26"/>
    <path d="M6 36.5Q46 37.8 86 36.5T162 36.5" stroke-width="0.6" stroke-opacity="0.16"/>
  </g>

  <!-- Abgeplatzter Anstrich: darunter liegt graues Salzholz -->
  <g fill="#6f5c48" fill-opacity="0.28">
    <path d="M26 6.2q7-1.6 13 0.4t11-0.3l-0.7 2.6q-6 1.1-11.5-0.4T25.7 8.8z"/>
    <path d="M118 34.4q9-1.8 15 0.3t12 0.1l-0.6 2.5q-6.6 0.9-12.4-0.5t-12.8 0.2z"/>
    <path d="M96 8.6q5-1.0 8 0.4l-0.5 2.0q-4 0.6-7.6-0.5z"/>
  </g>

  <!-- Astloch -->
  <g>
    <ellipse cx="40" cy="21.5" rx="5.2" ry="3.3" fill="#2b0d07" fill-opacity="0.55"/>
    <ellipse cx="40" cy="21.5" rx="3.0" ry="1.9" fill="#1a0704" fill-opacity="0.6"/>
    <ellipse cx="40" cy="21.5" rx="7.4" ry="4.8" fill="none" stroke="#2b0d07"
             stroke-opacity="0.3" stroke-width="0.7"/>
  </g>

  <!-- Plankenstoesse -->
  <g stroke-linecap="round">
    <path d="M15.5 3.5V39.5" stroke="#280a05" stroke-opacity="0.6" stroke-width="1.1"/>
    <path d="M16.6 3.5V39.5" stroke="#d1795e" stroke-opacity="0.26" stroke-width="0.7"/>
    <path d="M152.5 3.5V39.5" stroke="#280a05" stroke-opacity="0.6" stroke-width="1.1"/>
    <path d="M153.6 3.5V39.5" stroke="#d1795e" stroke-opacity="0.26" stroke-width="0.7"/>
  </g>

  <!-- Eisennieten -->
  <g fill="url(#nail)" stroke="#240a06" stroke-width="0.6">
    <circle cx="8.3" cy="12.5" r="2.2"/>
    <circle cx="8.3" cy="30.5" r="2.2"/>
    <circle cx="159.7" cy="12.5" r="2.2"/>
    <circle cx="159.7" cy="30.5" r="2.2"/>
  </g>

  <!-- Kantenlicht oben / Schattenfuge unten -->
  <g fill="none" stroke-linecap="round">
    <path d="M6.0 2.4H162.0" stroke="#e08b6b" stroke-opacity="0.5" stroke-width="1.2"/>
    <path d="M6.0 40.8H162.0" stroke="#000000" stroke-opacity="0.5" stroke-width="1.6"/>
  </g>

  <rect x="1" y="1" width="166" height="41" rx="4" ry="4"
        fill="none" stroke="#230906" stroke-width="1.6"/>
</svg>
