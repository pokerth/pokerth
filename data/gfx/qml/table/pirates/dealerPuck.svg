<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Pirates: schwarze Kanonenkugel mit brennender Lunte, Dealer-Marke weiss
       in der Mitte. Die Kugel sitzt leicht links-unten, damit die Lunte in die
       freie Ecke laeuft - so bleibt die Kugel trotz Lunte fast so gross wie
       die Dublonen der Blinds. -->
  <defs>
    <radialGradient id="iron" cx="32%" cy="28%" r="78%">
      <stop offset="0" stop-color="#5c5c5e"/>
      <stop offset="0.45" stop-color="#242426"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="fuse" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6f45"/>
      <stop offset="0.6" stop-color="#c0a173"/>
      <stop offset="1" stop-color="#e0c495"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.45" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#c33a08"/>
    </radialGradient>
  </defs>

  <!-- Lunte: geflochtenes Hanfseil aus dem Zuendloch, Funke an der Spitze -->
  <g fill="none" stroke-linecap="round">
    <path d="M26.2 8.6q3.4-3.6 7.6-4.2" stroke="#2a2118" stroke-width="3.6"/>
    <path d="M26.2 8.6q3.4-3.6 7.6-4.2" stroke="url(#fuse)" stroke-width="2.4"/>
    <g stroke="#6b5431" stroke-width="0.6" stroke-opacity="0.75">
      <path d="M27.6 7.2l0.9 1.1M29.6 5.9l0.8 1.2M31.8 5.0l0.6 1.3"/>
    </g>
  </g>
  <circle cx="34.6" cy="4.0" r="2.5" fill="url(#ember)"/>
  <circle cx="34.6" cy="4.0" r="1.1" fill="#fff6d6"/>

  <!-- Gusseiserne Kugel -->
  <circle cx="18.4" cy="21.8" r="17.2" fill="url(#iron)" stroke="#000000" stroke-width="0.9"/>

  <!-- Gussnarben -->
  <g fill="#000000" fill-opacity="0.45">
    <circle cx="9.4"  cy="14.2" r="1.1"/>
    <circle cx="27.0" cy="31.4" r="1.3"/>
    <circle cx="12.6" cy="32.6" r="0.9"/>
    <circle cx="29.6" cy="16.4" r="0.8"/>
  </g>
  <g fill="#8b8b8f" fill-opacity="0.22">
    <circle cx="9.0"  cy="13.6" r="0.5"/>
    <circle cx="26.5" cy="30.6" r="0.6"/>
    <circle cx="12.2" cy="32.0" r="0.4"/>
  </g>

  <!-- Zuendloch, aus dem die Lunte kommt -->
  <ellipse cx="26.3" cy="9.4" rx="2.3" ry="1.9" fill="#0a0a0b"
           stroke="#4b4b4e" stroke-width="0.6" transform="rotate(-38 26.3 9.4)"/>

  <!-- Streiflicht oben links / Reflex des Tischlichts unten rechts -->
  <ellipse cx="11.6" cy="13.4" rx="5.4" ry="3.6" fill="#ffffff" fill-opacity="0.16"
           transform="rotate(-40 11.6 13.4)"/>
  <path d="M6.0 30.4a13.6 13.6 0 0 0 20.6 4.8" fill="none" stroke="#c9c9cf"
        stroke-opacity="0.18" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Dealer-Marke -->
  <text x="18.4" y="28.4" text-anchor="middle" font-family="Georgia, serif" font-size="19"
        font-weight="700" fill="#ffffff">D</text>
</svg>
